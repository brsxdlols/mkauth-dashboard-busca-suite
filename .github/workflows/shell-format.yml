name: Shell installation format
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  shell-format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/check-shell-format.py
      - name: Check shell syntax
        run: find . -type f -name '*.sh' -not -path './.git/*' -print0 | xargs -0 -r -n1 bash -n
