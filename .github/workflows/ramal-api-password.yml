name: Ramal API password protection
on:
  push:
    paths:
      - 'admin/mka_suite_ramal_password_guard.hhvm'
      - 'addons/shared/*ramal*'
      - 'addons/dashboard/ramal_api_access.php'
      - 'scripts/*ramal*'
      - '.github/workflows/ramal-api-password.yml'
  pull_request:
jobs:
  checks:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: php -l admin/mka_suite_ramal_password_guard.hhvm && php -l addons/dashboard/ramal_api_access.php
      - run: php scripts/test-ramal-api-password.php addons/shared
      - run: node scripts/test-ramal-api-password-browser.cjs
      - run: node scripts/test-ramal-sync-help.cjs
