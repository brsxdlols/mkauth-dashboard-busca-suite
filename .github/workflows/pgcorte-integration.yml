name: PGCORTE installer integration
on:
  push:
    paths:
      - 'install.sh'
      - 'scripts/install-pgcorte-dual.py'
      - 'scripts/pgcorte_apparmor.py'
      - 'scripts/pgcorte_modphp.py'
      - 'scripts/test-pgcorte-modphp.py'
      - 'scripts/test-pgcorte-apparmor.py'
      - 'scripts/install-progress.py'
      - 'scripts/test-pgcorte-integration.py'
      - 'scripts/test-install-progress.py'
      - '.github/workflows/pgcorte-integration.yml'
  pull_request:
    paths:
      - 'install.sh'
      - 'scripts/install-pgcorte-dual.py'
      - 'scripts/pgcorte_apparmor.py'
      - 'scripts/pgcorte_modphp.py'
      - 'scripts/test-pgcorte-modphp.py'
      - 'scripts/test-pgcorte-apparmor.py'
      - 'scripts/install-progress.py'
      - 'scripts/test-pgcorte-integration.py'
      - 'scripts/test-install-progress.py'
      - '.github/workflows/pgcorte-integration.yml'
jobs:
  isolated-tests:
    runs-on: ubuntu-22.04
    strategy:
      matrix:
        python-version: ['3.9', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: bash -n install.sh
      - run: python scripts/test-pgcorte-modphp.py
      - run: python scripts/test-pgcorte-apparmor.py
      - run: python scripts/test-pgcorte-integration.py
      - run: python scripts/test-install-progress.py

